# FleetFlow — project build/tool config (tests, lint, formatting)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=line"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# smoke_check.py intentionally mutates sys.path before project imports.
"scripts/smoke_check.py" = ["E402"]