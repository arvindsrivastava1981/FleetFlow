services:
  - type: web
    name: fleetflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheck:
      # GET /healthz — verifies the app boots AND the DB is reachable.
      path: /healthz
    envVars:
      - key: PORT
        value: 10000
      # Required by backend/app/core/config.py — the app refuses to boot without
      # these (no hardcoded fallback in production). Set via the
      # Render dashboard "Environment" tab as secrets:
      - key: DATABASE_URL
        sync: false # set manually (Neon Postgres connection string)
      - key: USER_PASSWORD
        sync: false # set manually (strong  password)
      - key: ENV
        value: production
