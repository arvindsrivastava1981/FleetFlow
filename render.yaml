# Render Blueprint for VahanKhata — three services:
#   1) "vahankhata-site" = Static Site that publishes the marketing site (public-site/dist)
#   2) "vahankhata-app"  = Static Site that publishes the app SPA (frontend/dist)
#   3) "vahankhata-api"  = Web Service running the FastAPI JSON API (/api/v1/*)
#
# Both SPAs are client-side routers (React Router v6). The app SPA must call the
# API cross-origin, so it is built with VITE_API_BASE_URL pointing at the API web
# service, and the FastAPI web service must allow that origin via CORS. The
# marketing site hard-codes the app origin for its "Log in" links in
# public-site/src/config.js.
#
# NOTE: Render static-site redirect/rewrite rules are configured ONLY from the
# Render Dashboard — there is no render.yaml field for them. BOTH static sites
# must have one rewrite rule so all SPA routes serve index.html:
#     Source: /*     Action: Rewrite     Destination: /index.html
# (Otherwise deep links e.g. /about, /features, /pricing, /trips/:code 404.)
services:
  # ---- Static Site: the public marketing site --------------------------------
  - type: static
    name: vahankhata-site
    branch: main
    buildCommand: cd public-site && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: public-site/dist
    envVars:
      - key: CI
        value: "false"

  # ---- Static Site: the React app SPA -----------------------------------------
  - type: static
    name: vahankhata-app
    branch: main
    buildCommand: cd frontend && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: CI
        value: "false"
      # The SPA's frontend/src/lib/api.js reads this to call the API web
      # service cross-origin (default is "" / same-origin, which would break
      # a separately-hosted static SPA).
      - key: VITE_API_BASE_URL
        value: https://api.vahankhata.in

  # ---- Web Service: the FastAPI JSON API ----------------------------------
  - type: web
    name: vahankhata-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    branch: main
    healthCheck:
      # GET /healthz — verifies the API boots AND the DB is reachable.
      path: /healthz
    envVars:
      - key: PORT
        value: 10000
      # Required by backend/app/core/config.py — the app refuses to boot without
      # these (no hardcoded fallback in production). Set via the
      # Render dashboard "Environment" tab as secrets:
      - key: DATABASE_URL
        sync: false # set manually (Neon Postgres connection string)
      - key: USER_PASSWORD
        sync: false # set manually (strong  password)
      - key: APP_PUBLIC_URL
        value: https://app.vahankhata.in
      - key: ENV
        value: production
