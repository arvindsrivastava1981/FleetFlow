name: Daily maintenance (F-8)

# Runs the cron_daily.py housekeeping job: purge expired sessions + refresh
# live fuel benchmarks. Requires repo secret DATABASE_URL (Neon DSN).
on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC daily
  workflow_dispatch:

concurrency:
  group: cron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/cron_daily.py
